---
- name: dashboard_api | ensure directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0750'
  loop:
    - "{{ dashboard_api_dir }}"
    - "{{ dashboard_ui_dir }}"

- name: dashboard_api | render API server
  ansible.builtin.template:
    src: api_server.py.j2
    dest: "{{ dashboard_api_dir }}/api_server.py"
    mode: '0750'

- name: dashboard_api | render launcher
  ansible.builtin.template:
    src: start_dashboard.sh.j2
    dest: "{{ dashboard_launcher_path }}"
    mode: '0750'

- name: dashboard_api | render UI landing page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ dashboard_ui_dir }}/index.html"
    mode: '0640'

- name: dashboard_api | validate Python syntax
  ansible.builtin.command: python3 -m py_compile "{{ dashboard_api_dir }}/api_server.py"
  changed_when: false

- name: dashboard_api | validate launcher shell syntax
  ansible.builtin.command: bash -n "{{ dashboard_launcher_path }}"
  changed_when: false

- name: dashboard_api | persist asset manifest
  ansible.builtin.copy:
    dest: "{{ dashboard_api_dir }}/manifest.json"
    mode: '0640'
    content: |
      {
        "api_port": {{ dashboard_api_port }},
        "ui_port": {{ dashboard_ui_port }},
        "launcher": "{{ dashboard_launcher_path }}"
      }
