---
- name: dashboard_api | ensure directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0750'
  loop:
    - "{{ dashboard_api_dir }}"
    - "{{ dashboard_ui_dir }}"

- name: dashboard_api | verify api process is running
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dashboard_api_port }}{{ dashboard_health_path }}"
    method: GET
    return_content: yes
    status_code: 200
  register: api_health
  ignore_errors: yes

- name: dashboard_api | warn if control plane is down
  ansible.builtin.debug:
    msg: "WARNING: Pocket Lab API is not responding on port {{ dashboard_api_port }}. Ensure start-dashboard.sh was executed."
  when: api_health.failed

- name: dashboard_api | persist asset manifest
  ansible.builtin.copy:
    dest: "{{ dashboard_api_dir }}/manifest.json"
    mode: '0640'
    content: |
      {
        "api_port": {{ dashboard_api_port }},
        "ui_dir": "{{ dashboard_ui_dir }}",
        "health_endpoint": "{{ dashboard_health_path }}"
      }