---
nats_enabled: true
nats_server_name: pocketlab-nats
nats_config_dir: "{{ common_nats_dir | default(common_state_dir + '/nats') }}"
nats_store_dir: "{{ nats_config_dir }}/store"
nats_config_path: "{{ nats_config_dir }}/nats-server.conf"
nats_env_path: "{{ nats_config_dir }}/pocketlab-nats.env"
nats_listen_host: 127.0.0.1
nats_client_port: 4222
nats_monitor_host: 127.0.0.1
nats_monitor_port: 8222
nats_max_mem_store: 64MB
nats_max_file_store: 1GB
nats_require_jetstream: true
nats_require_auth: true
nats_start_command: "nats-server -c {{ nats_config_path }}"

pocketlab_nats_url: "nats://{{ nats_listen_host }}:{{ nats_client_port }}"
pocketlab_nats_monitor_url: "http://{{ nats_monitor_host }}:{{ nats_monitor_port }}/varz"
pocketlab_nats_api_user: pocketlab_api
pocketlab_nats_worker_user: pocketlab_worker
pocketlab_nats_agent_user: pocketlab_agent
pocketlab_nats_api_password: "{{ lookup('env', 'POCKETLAB_NATS_API_PASSWORD') | default('', true) }}"
pocketlab_nats_worker_password: "{{ lookup('env', 'POCKETLAB_NATS_WORKER_PASSWORD') | default('', true) }}"
pocketlab_nats_agent_password: "{{ lookup('env', 'POCKETLAB_NATS_AGENT_PASSWORD') | default('', true) }}"
pocketlab_nats_tls_enabled: false
pocketlab_nats_tls_ca: "{{ lookup('env', 'POCKETLAB_NATS_TLS_CA') | default('', true) }}"
pocketlab_nats_tls_cert: "{{ lookup('env', 'POCKETLAB_NATS_TLS_CERT') | default('', true) }}"
pocketlab_nats_tls_key: "{{ lookup('env', 'POCKETLAB_NATS_TLS_KEY') | default('', true) }}"
