---
caddy_public_port: 8443
caddy_config_path: "{{ common_base_dir }}/caddy/Caddyfile"
caddy_state_dir: "{{ common_base_dir }}/caddy"

# Day-3: Static PWA directory default
caddy_pwa_dir: "{{ common_base_dir }}/pwa_dist"

# Day-3: Optional Tailscale FQDN for HTTPS (e.g., pocket-lab.tailnet123.ts.net)
# If left blank, falls back to standard HTTP on caddy_public_port
caddy_tailscale_fqdn: ""

# Backend service proxies
caddy_routes:
  api: 127.0.0.1:8080
  gitea: 127.0.0.1:3030
  loki: 127.0.0.1:8080
  gatus: 127.0.0.1:8081

caddy_tls_mode: internal
caddy_hsts_max_age: 31536000
