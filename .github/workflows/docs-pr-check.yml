name: Validate MkDocs documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "requirements-dev.txt"
      - "scripts/docs/**"
      - "architecture/structurizr/**"
      - "contracts/**"
      - "operations/**"
      - "runbooks/**"
      - "security/**"
      - ".github/workflows/**"
      - "Taskfile.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-pr-check:
    name: Generate, validate, and check documentation freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Taskfile
        uses: arduino/setup-task@v2
        with:
          version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-docs.txt -r requirements-dev.txt -r pocket-lab-final-structure/runtime/requirements.txt

      - name: Install Node dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Generate and validate documentation
        run: mkdocs build --strict

      - name: Check generated documentation freshness
        run: git diff --exit-code -- docs/development/generated/github-actions-workflows.md

      - name: Upload generated documentation on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-pr-check-debug
          path: |
            site/
            docs/development/generated/github-actions-workflows.md
            contracts/generated/openapi.json
            contracts/asyncapi/pocketlab-nats-jetstream.yaml
          if-no-files-found: ignore
